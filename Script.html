    try {
      _settings = await API.getAllSettings();
    } catch (e) {
      Toast.show('Error', 'Could not load settings.', 'error');
      return;
    }

    container.innerHTML = `
      <div class="settings-layout">

        <!-- Settings Navigation -->
        <nav class="settings-nav" aria-label="Settings sections">
          <div class="settings-nav__item settings-nav__item--active" data-section="expiry" tabindex="0">⏰ Expiry Rules</div>
          <div class="settings-nav__item" data-section="table" tabindex="0">📋 Table Preferences</div>
          <div class="settings-nav__item" data-section="system" tabindex="0">🖥️ System</div>
        </nav>

        <!-- Settings Panels -->
        <div class="settings-panel" id="settingsPanelContainer">

          <!-- Expiry Rules -->
          <section class="settings-section" id="settings-section-expiry" aria-labelledby="expiry-section-heading">
            <div class="settings-section__header">
              <div class="settings-section__title" id="expiry-section-heading">⏰ Document Expiry Rules</div>
              <div class="settings-section__desc">Define thresholds that control how document expiry statuses are classified.</div>
            </div>
            <div class="settings-section__body">
              ${_settingRow(
                'expiry.critical.days',
                'Critical Threshold (days)',
                'Documents expiring within this many days are marked as Critical.',
                _settings['expiry.critical.days'] ?? '30',
                'number'
              )}
              ${_settingRow(
                'expiry.dueSoon.days',
                'Due Soon Threshold (days)',
                'Documents expiring within this many days are marked as Due Soon.',
                _settings['expiry.dueSoon.days'] ?? '90',
                'number'
              )}
            </div>
          </section>

          <!-- Table Preferences -->
          <section class="settings-section" id="settings-section-table" aria-labelledby="table-section-heading">
            <div class="settings-section__header">
              <div class="settings-section__title" id="table-section-heading">📋 Table Preferences</div>
              <div class="settings-section__desc">Configure default behavior of data tables across the application.</div>
            </div>
            <div class="settings-section__body">
              ${_settingRow(
                'table.defaultPageSize',
                'Default Page Size',
                'Number of rows displayed per page in all tables.',
                _settings['table.defaultPageSize'] ?? '25',
                'number'
              )}
              ${_settingRow(
                'table.defaultSortField',
                'Default Sort Field',
                'Field used to sort the employee table on initial load.',
                _settings['table.defaultSortField'] ?? 'name',
                'text'
              )}
            </div>
          </section>

          <!-- System Settings -->
          <section class="settings-section" id="settings-section-system" aria-labelledby="system-section-heading">
            <div class="settings-section__header">
              <div class="settings-section__title" id="system-section-heading">🖥️ System</div>
              <div class="settings-section__desc">Core system configuration options.</div>
            </div>
            <div class="settings-section__body">
              ${_settingRow(
                'system.timezone',
                'System Timezone',
                'Timezone used for date calculations and reporting.',
                _settings['system.timezone'] ?? 'Asia/Muscat',
                'text'
              )}
            </div>
          </section>

          <!-- Save Button -->
          <div style="display:flex;justify-content:flex-end;gap:var(--space-3);padding:var(--space-4) 0;">
            <button class="btn btn--secondary" id="settingsResetBtn">Reset Defaults</button>
            <button class="btn btn--primary" id="settingsSaveBtn">💾 Save All Settings</button>
          </div>

        </div>
      </div>
    `;

    _bindEvents(container);
  }

  // ── Event Binding ──────────────────────────────────────────

  function _bindEvents(container) {
    // Section navigation
    container.querySelectorAll('.settings-nav__item').forEach(item => {
      item.addEventListener('click', () => {
        container.querySelectorAll('.settings-nav__item').forEach(i => i.classList.remove('settings-nav__item--active'));
        item.classList.add('settings-nav__item--active');
        const section = item.dataset.section;
        document.getElementById(`settings-section-${section}`)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
      item.addEventListener('keydown', e => { if (e.key === 'Enter') item.click(); });
    });

    // Save
    document.getElementById('settingsSaveBtn')?.addEventListener('click', _saveAll);

    // Reset
    document.getElementById('settingsResetBtn')?.addEventListener('click', _confirmReset);
  }

  // ── Save / Reset ───────────────────────────────────────────

  async function _saveAll() {
    const inputs = document.querySelectorAll('[data-setting-key]');
    const map = {};
    inputs.forEach(input => {
      map[input.dataset.settingKey] = input.value.trim();
    });

    const saveBtn = document.getElementById('settingsSaveBtn');
    saveBtn.disabled = true;
    saveBtn.textContent = 'Saving…';

    try {
      await API.bulkUpdateSettings(map);
      Toast.show('Settings Saved', 'All settings have been saved successfully.', 'success');
    } catch (e) {
      Toast.show('Save Failed', e.message, 'error');
    } finally {
      saveBtn.disabled = false;
      saveBtn.textContent = '💾 Save All Settings';
    }
  }

  function _confirmReset() {
    if (!confirm('Reset all settings to defaults? This cannot be undone.')) return;
    const defaults = {
      'expiry.critical.days': '30',
      'expiry.dueSoon.days': '90',
      'table.defaultPageSize': '25',
      'table.defaultSortField': 'name',
      'system.timezone': 'Asia/Muscat',
    };
    document.querySelectorAll('[data-setting-key]').forEach(input => {
      const key = input.dataset.settingKey;
      if (defaults[key]) input.value = defaults[key];
    });
    Toast.show('Defaults Restored', 'Click Save to apply.', 'info');
  }

  // ── UI Builders ────────────────────────────────────────────

  function _settingRow(key, label, desc, currentValue, type = 'text') {
    return `
      <div class="setting-row">
        <div class="setting-row__info">
          <div class="setting-row__label">${_esc(label)}</div>
          <div class="setting-row__desc">${_esc(desc)}</div>
        </div>
        <div class="setting-row__control">
          <input
            type="${type}"
            class="form-input"
            style="width:140px;"
            value="${_esc(currentValue)}"
            data-setting-key="${_esc(key)}"
            id="setting-${_esc(key.replace(/\./g, '-'))}"
            aria-label="${_esc(label)}"
            ${type === 'number' ? 'min="1" max="3650"' : ''}
          >
        </div>
      </div>
    `;
  }

  function _esc(str) {
    return String(str ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  return { render };
})();


/* --- js/modules/search.js --- */
/**
 * @file search.js
 * @description Global Search module — client-side instant search across
 *              all employee fields using a pre-built search index.
 */

'use strict';

const SearchModule = (() => {

  let _index  = [];   // Flat searchable index
  let _visible = false;

  const SEARCH_FIELDS = [
    'code', 'name', 'nameAr', 'email', 'telephone',
    'passportNo', 'civilNo', 'department', 'section', 'project', 'title',
  ];

  const MAX_RESULTS = 8;

  const inputEl   = document.getElementById('globalSearchInput');
  const resultsEl = document.getElementById('globalSearchResults');

  // ── Index Building ─────────────────────────────────────────

  /**
   * Builds the searchable index from the employee array.
   * Call once when employees data is loaded.
   * @param {Object[]} employees
   */
  function buildIndex(employees) {
    _index = employees.map(emp => ({
      emp,
      searchText: SEARCH_FIELDS
        .map(f => String(emp[f] ?? '').toLowerCase())
        .join(' '),
    }));
  }

  // ── Search Logic ───────────────────────────────────────────

  function _search(query) {
    if (!query || query.trim().length < 2) return [];
    const terms = query.toLowerCase().trim().split(/\s+/);
    return _index
      .filter(({ searchText }) => terms.every(t => searchText.includes(t)))
      .slice(0, MAX_RESULTS)
      .map(({ emp }) => emp);
  }

  // ── Results Rendering ──────────────────────────────────────

  function _renderResults(results, query) {
    if (results.length === 0) {
      resultsEl.innerHTML = `
        <div class="search-result-item" style="cursor:default;color:var(--color-text-muted);">
          <span>No employees found for "<strong>${_esc(query)}</strong>"</span>
        </div>
      `;
    } else {
      resultsEl.innerHTML = results.map(emp => `
        <div class="search-result-item" data-code="${_esc(emp.code)}" tabindex="0" role="option" aria-label="${_esc(emp.name)}">
          <span class="search-result-item__code">${_esc(emp.code)}</span>
          <div>
            <div class="search-result-item__name">${_esc(emp.name)}</div>
            <div class="search-result-item__meta">${_esc(emp.title || '')} · ${_esc(emp.department || '')} · ${_esc(emp.project || '')}</div>
          </div>
        </div>
      `).join('');

      // Result click listeners
      resultsEl.querySelectorAll('.search-result-item[data-code]').forEach(item => {
        item.addEventListener('click',   () => _selectResult(item.dataset.code));
        item.addEventListener('keydown', e => { if (e.key === 'Enter') _selectResult(item.dataset.code); });
      });
    }
    _show();
  }

  async function _selectResult(code) {
    _hide();
    inputEl.value = '';
    // Navigate to Employees page and open drawer
    AppRouter.navigate('employees');
    await new Promise(r => setTimeout(r, 100)); // allow page switch
    try {
      const emp = await API.getEmployeeByCode(code);
      if (emp) Drawer.open(emp);
    } catch (e) {
      Toast.show('Error', 'Could not load employee profile.', 'error');
    }
  }

  // ── Show / Hide ────────────────────────────────────────────

  function _show() {
    resultsEl.classList.add('global-search__results--visible');
    inputEl.setAttribute('aria-expanded', 'true');
    _visible = true;
  }

  function _hide() {
    resultsEl.classList.remove('global-search__results--visible');
    inputEl.setAttribute('aria-expanded', 'false');
    _visible = false;
  }

  // ── Event Listeners ────────────────────────────────────────

  let _debounce;

  inputEl?.addEventListener('input', () => {
    clearTimeout(_debounce);
    const query = inputEl.value.trim();
    if (!query || query.length < 2) { _hide(); return; }
    _debounce = setTimeout(() => {
      const results = _search(query);
      _renderResults(results, query);
    }, 150);
  });

  inputEl?.addEventListener('keydown', e => {
    if (e.key === 'Escape') { _hide(); inputEl.blur(); }
  });

  document.addEventListener('click', e => {
    if (_visible && !e.target.closest('.global-search')) _hide();
  });

  // Ctrl+K shortcut
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
      e.preventDefault();
      inputEl?.focus();
      inputEl?.select();
    }
  });

  function _esc(str) {
    return String(str ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  return { buildIndex };
})();


/* --- js/app.js --- */
/**
 * @file app.js
 * @description Application bootstrap, SPA router, and shared state manager.
 *              This is the last script loaded and the entry point for execution.
 *
 *  Responsibilities:
 *  1. Initialize the app on DOMContentLoaded.
 *  2. Load initial data from GAS (employees, documents, settings).
 *  3. Build the global search index.
 *  4. Route page navigation requests.
 *  5. Manage the collapsible sidebar.
 */

'use strict';

// ═══════════════════════════════════════════════════════════════
//  APP STATE  (shared in-memory data store)
// ═══════════════════════════════════════════════════════════════

const AppState = {
  employees:   [],
  documents:   null,
  insights:    null,
  settings:    {},
  currentPage: 'dashboard',
};

// ═══════════════════════════════════════════════════════════════
//  ROUTER
// ═══════════════════════════════════════════════════════════════

const PAGE_TITLES = {
  dashboard: 'Dashboard',
  insights:  'HR Insights',
  employees: 'Employees',
  documents: 'Document Center',
  settings:  'Settings',
};

const AppRouter = (() => {

  const _pageModuleMap = {
    dashboard: () => {
      if (AppState.employees.length && AppState.documents) {
        DashboardModule.render(AppState.employees, AppState.documents);
      }
    },
    insights: async () => {
      if (!AppState.insights) {
        _showPageLoading('insightsContent');
        try {
          AppState.insights = await API.getInsightsData();
        } catch (e) {
          Toast.show('Error', 'Could not load HR Insights data.', 'error');
          return;
        }
      }
      InsightsModule.render(AppState.insights);
    },
    employees: async () => {
      if (AppState.employees.length) {
        await EmployeesModule.render(AppState.employees);
      }
    },
    documents: async () => {
      if (!AppState.documents) {
        _showPageLoading('documentsContent');
        try {
          AppState.documents = await API.getDocumentCenterData();
        } catch (e) {
          Toast.show('Error', 'Could not load Document Center data.', 'error');
          return;
        }
      }
      DocumentCenterModule.render(AppState.documents);
    },
    settings: () => SettingsModule.render(),
  };

  /**
   * Navigates to a page by key.
   * @param {string} page
   */
  async function navigate(page) {
    if (!PAGE_TITLES[page]) return;

    // Deactivate current page
    document.getElementById(`page-${AppState.currentPage}`)?.classList.remove('page-view--active');

    // Update active nav item
    document.querySelectorAll('.sidebar__nav-item').forEach(item => {
      const isActive = item.dataset.page === page;
      item.classList.toggle('sidebar__nav-item--active', isActive);
      item.setAttribute('aria-current', isActive ? 'page' : 'false');
    });

    // Update header title
    const titleEl = document.getElementById('headerPageTitle');
    if (titleEl) titleEl.textContent = PAGE_TITLES[page];

    // Activate page
    AppState.currentPage = page;
    document.getElementById(`page-${page}`)?.classList.add('page-view--active');

    // Render module
    const moduleFn = _pageModuleMap[page];
    if (moduleFn) await moduleFn();

    // Mobile: close sidebar after navigation
    if (window.innerWidth <= 768) {
      document.querySelector('.sidebar')?.classList.remove('sidebar--mobile-open');
    }
  }

  function _showPageLoading(containerId) {
    const el = document.getElementById(containerId);
    if (el) el.innerHTML = `
      <div style="display:flex;align-items:center;justify-content:center;padding:80px 0;gap:16px;color:var(--color-text-muted);">
        <div class="app-loading__spinner" style="width:32px;height:32px;border-width:2px;"></div>
        <span>Loading data…</span>
      </div>
    `;
  }

  return { navigate };
})();

// ═══════════════════════════════════════════════════════════════
//  SIDEBAR TOGGLE
// ═══════════════════════════════════════════════════════════════

function _initSidebar() {
  const shell   = document.getElementById('appShell');
  const sidebar = document.getElementById('sidebar');
  const toggleBtn = document.getElementById('sidebarToggle');

  toggleBtn?.addEventListener('click', () => {
    const isMobile = window.innerWidth <= 768;
    if (isMobile) {
      sidebar.classList.toggle('sidebar--mobile-open');
    } else {
      shell.classList.toggle('app-shell--collapsed');
      sidebar.classList.toggle('sidebar--collapsed');
      const isExpanded = !shell.classList.contains('app-shell--collapsed');
      toggleBtn.setAttribute('aria-expanded', String(isExpanded));
    }
  });

  // Sidebar nav click delegation
  document.querySelector('.sidebar__nav')?.addEventListener('click', e => {
    const item = e.target.closest('.sidebar__nav-item[data-page]');
    if (item) AppRouter.navigate(item.dataset.page);
  });

  document.querySelector('.sidebar__nav')?.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const item = e.target.closest('.sidebar__nav-item[data-page]');
      if (item) AppRouter.navigate(item.dataset.page);
    }
  });
}

// ═══════════════════════════════════════════════════════════════
//  REFRESH BUTTON
// ═══════════════════════════════════════════════════════════════

function _initRefreshBtn() {
  document.getElementById('refreshBtn')?.addEventListener('click', async () => {
    API.invalidateCache();
    AppState.employees = [];
    AppState.documents = null;
    AppState.insights  = null;
    Toast.show('Refreshing', 'Reloading data from server…', 'info', 2000);
    await _loadInitialData();
    await AppRouter.navigate(AppState.currentPage);
  });
}

// ═══════════════════════════════════════════════════════════════
//  INITIAL DATA LOAD
// ═══════════════════════════════════════════════════════════════

async function _loadInitialData() {
  try {
    // Load employees and documents in parallel for faster startup
    const [employees, documents] = await Promise.all([
      API.getAllEmployees(),
      API.getDocumentCenterData(),
    ]);

    AppState.employees = employees ?? [];
    AppState.documents = documents ?? { summary: {}, documents: [] };

    // Build global search index
    SearchModule.buildIndex(AppState.employees);

    // Update dashboard last-updated timestamp
    const tsEl = document.getElementById('dashboardLastUpdated');
    if (tsEl) tsEl.textContent = `Last updated: ${new Date().toLocaleTimeString('en-GB')}`;

    return true;
  } catch (e) {
    console.error('[App] Initial data load failed:', e);
    Toast.show('Load Error', 'Failed to load employee data. Check your spreadsheet connection.', 'error', 8000);
    return false;
  }
}

// ═══════════════════════════════════════════════════════════════
//  BOOTSTRAP
// ═══════════════════════════════════════════════════════════════

async function _boot() {
  _initSidebar();
  _initRefreshBtn();
  FilterModule.init();

  const loaded = await _loadInitialData();

  // Hide loading screen
  const loadingEl = document.getElementById('appLoading');
  if (loadingEl) {
    loadingEl.classList.add('app-loading--hidden');
    setTimeout(() => loadingEl.remove(), 500);
  }

  // Show app shell
  const shellEl = document.getElementById('appShell');
  if (shellEl) shellEl.setAttribute('aria-hidden', 'false');

  // Render initial page
  if (loaded) {
    await AppRouter.navigate('dashboard');
  }
}

// ── Entry Point ────────────────────────────────────────────────
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', _boot);
} else {
  _boot();
}



// ═══════════════════════════════════════════════════════════════
//  FILTER MODULE
//  Public API: FilterModule.apply(filters), .reset(), .loadPresets()
// ═══════════════════════════════════════════════════════════════

'use strict';

const FilterModule = (() => {

  // ── State ──────────────────────────────────────────────────
  let _isOpen    = false;
  let _isBusy    = false;
  let _selections = {};   // { fieldId: Set<string> }
  let _applyDebounceTimer = null;

  // Dropdown config: { fieldId, optionsContainerId, displayId, triggerId, defaultLabel }
  const MULTI_SELECTS = [
    { field: 'fp-dept',        container: 'fp-dept-options',        display: 'fp-dept-display',        trigger: 'fp-dept-trigger',        label: 'All Departments' },
    { field: 'fp-title',       container: 'fp-title-options',       display: 'fp-title-display',       trigger: 'fp-title-trigger',       label: 'All Titles' },
    { field: 'fp-project',     container: 'fp-project-options',     display: 'fp-project-display',     trigger: 'fp-project-trigger',     label: 'All Projects' },
    { field: 'fp-gender',      container: 'fp-gender-options',      display: 'fp-gender-display',      trigger: 'fp-gender-trigger',      label: 'All Genders' },
    { field: 'fp-nationality', container: 'fp-nationality-options', display: 'fp-nationality-display', trigger: 'fp-nationality-trigger', label: 'All Nationalities' },
    { field: 'fp-bank',        container: 'fp-bank-options',        display: 'fp-bank-display',        trigger: 'fp-bank-trigger',        label: 'All Banks' },
    { field: 'fp-class',       container: 'fp-class-options',       display: 'fp-class-display',       trigger: 'fp-class-trigger',       label: 'All Classes' },
    { field: 'fp-direct',      container: 'fp-direct-options',      display: 'fp-direct-display',      trigger: 'fp-direct-trigger',      label: 'All' },
  ];

  // ── Init ───────────────────────────────────────────────────

  function init() {
    // Initialize selection state
    MULTI_SELECTS.forEach(ms => { _selections[ms.field] = new Set(); });

    // Wire toggle button in header
    document.getElementById('filterToggleBtn')?.addEventListener('click', toggle);

    // Wire close button inside pane
    document.getElementById('fp-toggle-close')?.addEventListener('click', close);

    // Wire mobile overlay close
    document.getElementById('fp-overlay')?.addEventListener('click', close);

    // Wire action buttons
    document.getElementById('fp-apply')?.addEventListener('click', () => applyFilters());
    document.getElementById('fp-reset')?.addEventListener('click', reset);
    document.getElementById('fp-save')?.addEventListener('click', _savePreset);
    document.getElementById('fp-saved')?.addEventListener('change', _onPresetChange);

    // Wire all multi-select dropdowns
    MULTI_SELECTS.forEach(ms => _initMultiSelect(ms));

    // Close all dropdowns when clicking outside
    document.addEventListener('click', _onDocumentClick);

    // Keyboard: Escape closes pane
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && _isOpen) close();
    });

    // Populate options + load presets after initial data is available
    _populateDropdowns();
    _loadPresets();
  }

  // ── Pane Open / Close ──────────────────────────────────────

  function open() {
    _isOpen = true;
    const pane = document.getElementById('filter-pane');
    const overlay = document.getElementById('fp-overlay');
    const btn = document.getElementById('filterToggleBtn');

    pane?.classList.remove('filter-pane--closed');
    pane?.setAttribute('aria-hidden', 'false');
    overlay?.classList.add('fp-overlay--visible');
    overlay?.setAttribute('aria-hidden', 'false');
    btn?.setAttribute('aria-expanded', 'true');

    // Focus first interactive element for a11y
    setTimeout(() => document.getElementById('fp-search')?.focus(), 320);
  }

  function close() {
    _isOpen = false;
    const pane = document.getElementById('filter-pane');
    const overlay = document.getElementById('fp-overlay');
    const btn = document.getElementById('filterToggleBtn');

    pane?.classList.add('filter-pane--closed');
    pane?.setAttribute('aria-hidden', 'true');
    overlay?.classList.remove('fp-overlay--visible');
    overlay?.setAttribute('aria-hidden', 'true');
    btn?.setAttribute('aria-expanded', 'false');
    btn?.focus();
  }

  function toggle() {
    _isOpen ? close() : open();
  }

  // ── Multi-Select Component ─────────────────────────────────

  function _initMultiSelect({ field, container, display, trigger, label }) {
    const triggerEl = document.getElementById(trigger);
    const listId = trigger.replace('-trigger', '-list');
    const listEl = document.getElementById(listId);
    if (!triggerEl || !listEl) return;

    triggerEl.addEventListener('click', e => {
      e.stopPropagation();
      const isOpen = listEl.classList.contains('fp-multiselect__dropdown--open');
      _closeAllDropdowns();
      if (!isOpen) {
        listEl.classList.add('fp-multiselect__dropdown--open');
        triggerEl.setAttribute('aria-expanded', 'true');
        listEl.querySelector('.fp-multiselect__search')?.focus();
      }
    });

    triggerEl.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        triggerEl.click();
      }
    });

    // In-dropdown search filter
    const searchInput = listEl.querySelector('.fp-multiselect__search');
    if (searchInput) {
      searchInput.addEventListener('input', () => {
        const q = searchInput.value.toLowerCase();
        const opts = document.getElementById(container);
        if (!opts) return;
        opts.querySelectorAll('.fp-multiselect__option').forEach(opt => {
          const text = opt.querySelector('.fp-multiselect__option-label')?.textContent.toLowerCase() ?? '';
          opt.style.display = text.includes(q) ? '' : 'none';
        });
      });
    }
  }

  function _buildOption(value, fieldId, config) {
    const opt = document.createElement('div');
    opt.className = 'fp-multiselect__option';
    opt.setAttribute('role', 'option');
    opt.setAttribute('aria-selected', 'false');
    opt.dataset.value = value;

    opt.innerHTML = `
      <span class="fp-multiselect__option-check" aria-hidden="true">✓</span>
      <span class="fp-multiselect__option-label">${value}</span>
    `;

    opt.addEventListener('click', e => {
      e.stopPropagation();
      _toggleOption(value, fieldId, opt, config);
    });

    return opt;
  }

  function _toggleOption(value, fieldId, optEl, config) {
    const sel = _selections[fieldId];
    if (sel.has(value)) {
      sel.delete(value);
      optEl.classList.remove('fp-multiselect__option--selected');
      optEl.setAttribute('aria-selected', 'false');
    } else {
      sel.add(value);
      optEl.classList.add('fp-multiselect__option--selected');
      optEl.setAttribute('aria-selected', 'true');
    }
    _updateDisplayLabel(fieldId, config);
    _updateActiveIndicator();
  }

  function _updateDisplayLabel(fieldId, config) {
    const sel = _selections[fieldId];
    const displayEl = document.getElementById(config.display);
    if (!displayEl) return;

    if (sel.size === 0) {
      displayEl.textContent = config.label;
      displayEl.classList.remove('fp-multiselect__placeholder--selected');
    } else if (sel.size === 1) {
      displayEl.textContent = [...sel][0];
      displayEl.classList.add('fp-multiselect__placeholder--selected');
    } else {
      displayEl.textContent = `${sel.size} selected`;
      displayEl.classList.add('fp-multiselect__placeholder--selected');
    }
  }

  function _closeAllDropdowns() {
    document.querySelectorAll('.fp-multiselect__dropdown--open').forEach(d => {
      d.classList.remove('fp-multiselect__dropdown--open');
    });
    document.querySelectorAll('.fp-multiselect__trigger[aria-expanded="true"]').forEach(t => {
      t.setAttribute('aria-expanded', 'false');
    });
  }

  function _onDocumentClick(e) {
    if (!e.target.closest('.fp-multiselect')) _closeAllDropdowns();
  }

  function _populateContainerWithOptions(containerId, values, fieldId, config) {
    const container = document.getElementById(containerId);
    if (!container) return;
    container.innerHTML = '';

    if (!values || values.length === 0) {
      container.innerHTML = `<div class="fp-multiselect__empty">No options available</div>`;
      return;
    }

    values.forEach(v => {
      if (v) container.appendChild(_buildOption(String(v), fieldId, config));
    });
  }

  // ── Populate Dropdowns from API ────────────────────────────

  async function _populateDropdowns() {
    try {
      const lookup = await _callServer('api_getLookupData');
      if (!lookup) return;

      const fieldMap = {
        'fp-dept':        { data: lookup.departments,   config: MULTI_SELECTS.find(m => m.field === 'fp-dept') },
        'fp-title':       { data: lookup.titles,        config: MULTI_SELECTS.find(m => m.field === 'fp-title') },
        'fp-project':     { data: lookup.projects,      config: MULTI_SELECTS.find(m => m.field === 'fp-project') },
        'fp-gender':      { data: lookup.genders,       config: MULTI_SELECTS.find(m => m.field === 'fp-gender') },
        'fp-nationality': { data: lookup.nationalities, config: MULTI_SELECTS.find(m => m.field === 'fp-nationality') },
        'fp-bank':        { data: lookup.banks,         config: MULTI_SELECTS.find(m => m.field === 'fp-bank') },
        'fp-class':       { data: lookup.classes,       config: MULTI_SELECTS.find(m => m.field === 'fp-class') },
        'fp-direct':      { data: lookup.direct,        config: MULTI_SELECTS.find(m => m.field === 'fp-direct') },
      };

      Object.entries(fieldMap).forEach(([fieldId, { data, config }]) => {
        if (!config) return;
        _populateContainerWithOptions(config.container, data ?? [], fieldId, config);
      });
    } catch (err) {
      console.warn('[FilterModule] Could not populate dropdowns:', err);
    }
  }

  // ── Collect Values ─────────────────────────────────────────

  function collectFilterValues() {
    return {
      search:        document.getElementById('fp-search')?.value.trim() || null,
      departments:   [...(_selections['fp-dept']        ?? [])],
      titles:        [...(_selections['fp-title']       ?? [])],
      projects:      [...(_selections['fp-project']     ?? [])],
      genders:       [...(_selections['fp-gender']      ?? [])],
      nationalities: [...(_selections['fp-nationality'] ?? [])],
      banks:         [...(_selections['fp-bank']        ?? [])],
      classes:       [...(_selections['fp-class']       ?? [])],
      directs:       [...(_selections['fp-direct']      ?? [])],
      dateStart:     document.getElementById('fp-date-start')?.value || null,
      dateEnd:       document.getElementById('fp-date-end')?.value   || null,
      salaryMin:     parseFloat(document.getElementById('fp-salary-min')?.value) || null,
      salaryMax:     parseFloat(document.getElementById('fp-salary-max')?.value) || null,
      activeOnly:    document.getElementById('fp-active')?.checked ?? false,
    };
  }

  function _hasActiveFilters(filters) {
    if (!filters) return false;
    return (
      filters.search ||
      filters.departments?.length  || filters.titles?.length ||
      filters.projects?.length     || filters.genders?.length ||
      filters.nationalities?.length|| filters.banks?.length  ||
      filters.classes?.length      || filters.directs?.length ||
      filters.dateStart || filters.dateEnd ||
      filters.salaryMin || filters.salaryMax ||
      filters.activeOnly
    );
  }

  function _updateActiveIndicator() {
    const filters = collectFilterValues();
    const btn = document.getElementById('filterToggleBtn');
    if (!btn) return;
    if (_hasActiveFilters(filters)) {
      btn.classList.add('fp-open-btn--active');
    } else {
      btn.classList.remove('fp-open-btn--active');
    }
  }

  // ── Apply / Reset ──────────────────────────────────────────

  async function applyFilters(debounce = false) {
    if (_isBusy) return;

    if (debounce) {
      clearTimeout(_applyDebounceTimer);
      _applyDebounceTimer = setTimeout(() => applyFilters(false), 400);
      return;
    }

    const filters = collectFilterValues();
    _setLoading(true);

    try {
      const page = AppState?.currentPage;
      
      // Handle HR Insights page specifically
      if (page === 'insights') {
        const payload = await _callServer('api_getFilteredInsights', filters);
        
        // Update result count badge
        const countEl = document.getElementById('fp-result-count');
        if (countEl) countEl.textContent = payload.kpis?.totalEmployees ?? 0;
        
        _updateActiveIndicator();
        
        // Render insights
        if (typeof InsightsModule !== 'undefined' && InsightsModule.render) {
          InsightsModule.render(payload);
          Toast.show('Filters Applied', 'Insights data updated.', 'success');
        } else {
          Toast.show('Error', 'InsightsModule is not available.', 'error');
        }
      } 
      // Handle Dashboard and Employees pages
      else {
        const result = await _callServer('api_getFilteredEmployees', filters);
        const employees = result ?? [];

        // Update result count badge
        const countEl = document.getElementById('fp-result-count');
        if (countEl) countEl.textContent = employees.length;

        _updateActiveIndicator();

        // Render into the current page view
        if (page === 'dashboard') {
          DashboardModule.render(employees, AppState.documents);
        } else if (page === 'employees') {
          EmployeesModule.render(employees);
        }
      }
    } catch (err) {
      Toast.show('Filter Error', err?.message ?? 'Failed to apply filters.', 'error');
    } finally {
      _setLoading(false);
    }
  }

  function reset() {
    // Clear text / date / number inputs
    ['fp-search', 'fp-date-start', 'fp-date-end', 'fp-salary-min', 'fp-salary-max'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.value = '';
    });

    // Uncheck toggle
    const active = document.getElementById('fp-active');
    if (active) {
      active.checked = false;
      active.setAttribute('aria-checked', 'false');
    }

    // Clear all multi-select selections
    MULTI_SELECTS.forEach(ms => {
      _selections[ms.field].clear();
      _updateDisplayLabel(ms.field, ms);
      document.getElementById(ms.container)
        ?.querySelectorAll('.fp-multiselect__option--selected')
        .forEach(el => {
          el.classList.remove('fp-multiselect__option--selected');
          el.setAttribute('aria-selected', 'false');
        });
    });

    // Clear preset selector
    const savedEl = document.getElementById('fp-saved');
    if (savedEl) savedEl.value = '';

    // Update indicator
    _updateActiveIndicator();

    // Refresh view with unfiltered data
    applyFilters();
  }

  // ── Presets ────────────────────────────────────────────────

  async function _savePreset() {
    const name = prompt('Enter a name for this filter preset:')?.trim();
    if (!name) return;

    const filters = collectFilterValues();
    try {
      await _callServer('api_saveFilterPreset', 'default_user', name, filters);
      Toast.show('Preset Saved', `Preset "${name}" saved successfully.`, 'success');
      await _loadPresets();
    } catch (err) {
      Toast.show('Save Error', err?.message ?? 'Could not save preset.', 'error');
    }
  }

  async function _loadPresets() {
    try {
      const presets = await _callServer('api_getFilterPresets', 'default_user');
      const select = document.getElementById('fp-saved');
      if (!select || !presets) return;

      const currentVal = select.value;
      select.innerHTML = '<option value="">— Load preset —</option>';

      Object.entries(presets).forEach(([name, jsonStr]) => {
        const opt = document.createElement('option');
        opt.value = jsonStr;
        opt.textContent = name;
        select.appendChild(opt);
      });

      if (currentVal) select.value = currentVal;
    } catch (err) {
      console.warn('[FilterModule] Could not load presets:', err);
    }
  }

  function _onPresetChange(e) {
    const jsonStr = e.target.value;
    if (!jsonStr) return;

    try {
      const preset = JSON.parse(jsonStr);
      _applyPresetToUI(preset);
      applyFilters();
    } catch (err) {
      Toast.show('Error', 'Could not load preset.', 'error');
    }
  }

  function _applyPresetToUI(preset) {
    // Text / date / number inputs
    if (document.getElementById('fp-search'))      document.getElementById('fp-search').value      = preset.search ?? '';
    if (document.getElementById('fp-date-start'))  document.getElementById('fp-date-start').value  = preset.dateStart ?? '';
    if (document.getElementById('fp-date-end'))    document.getElementById('fp-date-end').value    = preset.dateEnd ?? '';
    if (document.getElementById('fp-salary-min'))  document.getElementById('fp-salary-min').value  = preset.salaryMin ?? '';
    if (document.getElementById('fp-salary-max'))  document.getElementById('fp-salary-max').value  = preset.salaryMax ?? '';

    const activeEl = document.getElementById('fp-active');
    if (activeEl) {
      activeEl.checked = !!preset.activeOnly;
      activeEl.setAttribute('aria-checked', String(!!preset.activeOnly));
    }

    // Multi-selects
    const fieldMap = {
      'fp-dept':        preset.departments,
      'fp-title':       preset.titles,
      'fp-project':     preset.projects,
      'fp-gender':      preset.genders,
      'fp-nationality': preset.nationalities,
      'fp-bank':        preset.banks,
      'fp-class':       preset.classes,
      'fp-direct':      preset.directs,
    };

    MULTI_SELECTS.forEach(ms => {
      const values = new Set(fieldMap[ms.field] ?? []);
      _selections[ms.field] = values;

      const container = document.getElementById(ms.container);
      container?.querySelectorAll('.fp-multiselect__option').forEach(opt => {
        const isSelected = values.has(opt.dataset.value);
        opt.classList.toggle('fp-multiselect__option--selected', isSelected);
        opt.setAttribute('aria-selected', String(isSelected));
      });

      _updateDisplayLabel(ms.field, ms);
    });

    _updateActiveIndicator();
  }

  // ── Loading State ──────────────────────────────────────────

  function _setLoading(busy) {
    _isBusy = busy;
    const loading = document.getElementById('fp-loading');
    const applyBtn = document.getElementById('fp-apply');

    loading?.classList.toggle('fp-loading--visible', busy);
    loading?.setAttribute('aria-hidden', String(!busy));

    if (applyBtn) {
      applyBtn.disabled = busy;
      applyBtn.textContent = busy ? 'Applying…' : 'Apply Filters';
    }
  }

  // ── Server Call Helper ─────────────────────────────────────

  function _callServer(fnName, ...args) {
    return new Promise((resolve, reject) => {
      const runner = google.script.run
        .withSuccessHandler(res => {
          if (res?.status === 'success') resolve(res.data);
          else reject(new Error(res?.message ?? `Server error in ${fnName}`));
        })
        .withFailureHandler(err => reject(new Error(err?.message ?? `Network error in ${fnName}`)));

      runner[fnName](...args);
    });
  }

  // ── Programmatic Cross-Filtering ─────────────────────────────

  /**
   * Sets a single filter value (replacing any existing values for that field)
   * and immediately applies the filters.
   * @param {string} fieldId - e.g., 'fp-dept'
   * @param {string} value - the exact value to filter by
   */
  function setFilter(fieldId, value) {
    if (!_selections[fieldId]) return;
    
    // Clear the current selections for this field
    _selections[fieldId].clear();
    
    // Add the new value
    if (value) {
      _selections[fieldId].add(value);
    }

    // Sync the UI
    const ms = MULTI_SELECTS.find(m => m.field === fieldId);
    if (ms) {
      const container = document.getElementById(ms.container);
      if (container) {
        container.querySelectorAll('.fp-multiselect__option').forEach(opt => {
          const isSelected = _selections[fieldId].has(opt.dataset.value);
          opt.classList.toggle('fp-multiselect__option--selected', isSelected);
          opt.setAttribute('aria-selected', String(isSelected));
        });
      }
      _updateDisplayLabel(ms.field, ms);
    }
    
    _updateActiveIndicator();
    
    // Apply filters and reload chart
    applyFilters();
  }

  // ── Public API ─────────────────────────────────────────────

  return {
    init,
    open,
    close,
    toggle,
    apply: applyFilters,
    reset,
    loadPresets: _loadPresets,
    collectFilterValues,
    setFilter,
  };

})();

// ── Wire FilterModule into _boot ────────────────────────────
const _originalBoot = typeof _boot === 'function' ? _boot : null;

/* ─────────────────────────────────────────────────────────────
   DragDrop Module — true sortable with live placeholder
   Cards can be freely moved to any position across all rows.
   ──────────────────────────────────────────────────────────── */
const DragDrop = (() => {
  'use strict';

  const STORAGE_KEY = 'hr_insights_layout_v2';

  let _dragSrc      = null;  // the card being dragged
  let _placeholder  = null;  // the ghost "gap" element
  let _sortableRoot = null;  // the flat sortable container

  // ── Bootstrap ────────────────────────────────────────────────

  /**
   * Called after InsightsModule injects its HTML.
   * Wraps all .chart-card elements into a single flat sortable container
   * so cards can move freely across every row.
   */
  function init() {
    const insightsContent = document.getElementById('insightsContent');
    if (!insightsContent) return;

    // Already initialised for this render cycle — skip
    if (insightsContent.querySelector('.dnd-sortable-root')) return;

    // Collect all chart cards rendered by InsightsModule
    const cards = [...insightsContent.querySelectorAll('.chart-card[data-chart-id]')];
    if (!cards.length) return;

    // Build the flat sortable grid that will hold every card
    const root = document.createElement('div');
    root.className = 'dnd-sortable-root';
    root.setAttribute('role', 'list');

    // Restore persisted order if available
    const savedOrder = _loadOrder();
    if (savedOrder?.length) {
      const cardMap = Object.fromEntries(cards.map(c => [c.dataset.chartId, c]));
      const ordered = savedOrder.map(id => cardMap[id]).filter(Boolean);
      // Append any new cards not yet in saved order
      cards.forEach(c => { if (!savedOrder.includes(c.dataset.chartId)) ordered.push(c); });
      ordered.forEach(c => root.appendChild(c));
    } else {
      cards.forEach(c => root.appendChild(c));
    }

    // Detach empty grid rows (they may have become empty wrappers)
    insightsContent.querySelectorAll('.charts-grid').forEach(g => {
      if (!g.querySelector('.chart-card')) g.remove();
    });

    // Wire drag events on each card
    root.querySelectorAll('.chart-card[data-chart-id]').forEach(_wireCard);

    // Insert the sortable root before whatever is left in insightsContent
    insightsContent.prepend(root);
    _sortableRoot = root;
  }

  // ── Card wiring ──────────────────────────────────────────────

  function _wireCard(card) {
    card.setAttribute('role', 'listitem');
    card.addEventListener('dragstart',  _onDragStart);
    card.addEventListener('dragend',    _onDragEnd);
  }

  // ── Drag event handlers ──────────────────────────────────────

  function _onDragStart(e) {
    _dragSrc = this;

    // Defer visual so browser captures the non-faded snapshot
    requestAnimationFrame(() => this.classList.add('chart-card--dragging'));

    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', this.dataset.chartId ?? '');

    // Create a placeholder the same size as the dragged card
    _placeholder = document.createElement('div');
    _placeholder.className = 'dnd-placeholder';
    _placeholder.style.width  = `${this.offsetWidth}px`;
    _placeholder.style.height = `${this.offsetHeight}px`;

    // Global listeners while dragging
    document.addEventListener('dragover',  _onDocDragOver,  { passive: false });
    document.addEventListener('drop',      _onDocDrop);
    document.addEventListener('dragenter', _onDocDragEnter, { passive: false });
  }

  function _onDragEnd() {
    if (_dragSrc) _dragSrc.classList.remove('chart-card--dragging');
    _placeholder?.remove();
    _placeholder  = null;
    _dragSrc      = null;

    document.removeEventListener('dragover',  _onDocDragOver);
    document.removeEventListener('drop',      _onDocDrop);
    document.removeEventListener('dragenter', _onDocDragEnter);
  }

  // ── Global drag-over — moves the placeholder ─────────────────

  function _onDocDragEnter(e) { e.preventDefault(); }

  function _onDocDragOver(e) {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';

    if (!_dragSrc || !_sortableRoot || !_placeholder) return;

    // Find which card the cursor is over (ignoring the source and placeholder)
    const target = _cardUnderCursor(e.clientX, e.clientY);
    if (!target || target === _dragSrc) return;

    // Determine if cursor is in the left or right half of the target
    const rect   = target.getBoundingClientRect();
    const midX   = rect.left + rect.width  / 2;
    const midY   = rect.top  + rect.height / 2;

    // Use horizontal midpoint primarily (grid layout), fallback to vertical
    const insertBefore = (e.clientX < midX) || (Math.abs(e.clientX - midX) < 10 && e.clientY < midY);

    if (insertBefore) {
      _sortableRoot.insertBefore(_placeholder, target);
    } else {
      _sortableRoot.insertBefore(_placeholder, target.nextSibling);
    }
  }

  // ── Drop — commit position ───────────────────────────────────

  function _onDocDrop(e) {
    e.preventDefault();
    if (!_dragSrc || !_placeholder || !_sortableRoot) return;

    // Insert the card where the placeholder currently sits
    _sortableRoot.insertBefore(_dragSrc, _placeholder);
    _placeholder.remove();
    _placeholder = null;
    _dragSrc.classList.remove('chart-card--dragging');

    _saveOrder();
  }

  // ── Helpers ──────────────────────────────────────────────────

  /**
   * Returns the chart-card element directly under the cursor,
   * skipping the dragging card and the placeholder.
   */
  function _cardUnderCursor(x, y) {
    const elements = document.elementsFromPoint(x, y);
    return elements.find(el =>
      el.classList.contains('chart-card') &&
      el !== _dragSrc &&
      el !== _placeholder
    ) ?? null;
  }

  // ── Persistence ──────────────────────────────────────────────

  function _saveOrder() {
    try {
      if (!_sortableRoot) return;
      const order = [..._sortableRoot.querySelectorAll('.chart-card[data-chart-id]')]
                      .map(c => c.dataset.chartId);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(order));
    } catch (_) { /* unavailable — silent */ }
  }

  function _loadOrder() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (_) { return null; }
  }

  /** Reset saved layout and reload */
  function reset() {
    try { localStorage.removeItem(STORAGE_KEY); } catch (_) {}
    location.reload();
  }

  return { init, reset };
})();

// Auto-init via MutationObserver — fires after InsightsModule.render() injects cards
(() => {
  let _timer = null;
  const _observer = new MutationObserver(() => {
    // Debounce: wait until DOM settles before initialising
    clearTimeout(_timer);
    _timer = setTimeout(() => DragDrop.init(), 80);
  });
  _observer.observe(document.body, { childList: true, subtree: true });
})();

</script>
