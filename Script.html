<script>
/* --- js/components/Toast.js --- */
/**
 * @file Toast.js
 * @description Reusable toast notification component.
 *              Usage: Toast.show('Title', 'Message', 'success'|'error'|'warning'|'info')
 */

'use strict';

const Toast = (() => {

  const ICONS = {
    success: '✅',
    error:   '❌',
    warning: '⚠️',
    info:    'ℹ️',
  };

  /**
   * Shows a toast notification.
   * @param {string} title
   * @param {string} message
   * @param {'success'|'error'|'warning'|'info'} [type='info']
   * @param {number} [duration=4000] Auto-dismiss after ms
   */
  function show(title, message, type = 'info', duration = 4000) {
    const container = document.getElementById('toastContainer');
    if (!container) return;

    const toast = document.createElement('div');
    toast.className = `toast toast--${type}`;
    toast.setAttribute('role', 'alert');
    toast.setAttribute('aria-live', 'assertive');
    toast.innerHTML = `
      <span class="toast__icon" aria-hidden="true">${ICONS[type] ?? ICONS.info}</span>
      <div class="toast__content">
        <div class="toast__title">${_escape(title)}</div>
        ${message ? `<div class="toast__message">${_escape(message)}</div>` : ''}
      </div>
    `;

    container.appendChild(toast);

    // Auto-dismiss
    setTimeout(() => _dismiss(toast), duration);
  }

  function _dismiss(toast) {
    toast.classList.add('toast--hiding');
    toast.addEventListener('animationend', () => toast.remove(), { once: true });
    setTimeout(() => toast.remove(), 500); // Fallback
  }

  function _escape(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  return { show };
})();


/* --- js/components/DataTable.js --- */
/**
 * @file DataTable.js
 * @description Reusable, client-side data table component.
 *              Supports: sorting, pagination, search filtering, custom renderers.
 *
 * Usage:
 *   const table = DataTable.create({
 *     containerId: 'myContainer',
 *     columns: [{ key, label, render? }],
 *     data: [],
 *     pageSize: 25,
 *     onRowAction: (action, row) => {}
 *   });
 *   table.setData(rows);
 */

'use strict';

const DataTable = (() => {

  /**
   * Creates a DataTable instance inside the given container.
   * @param {Object} config
   * @returns {{ setData: Function, refresh: Function }}
   */
  function create(config) {
    const {
      containerId,
      columns = [],
      data = [],
      pageSize = 25,
      searchFields = [],
      onRowAction = null,
      emptyMessage = 'No records found.',
    } = config;

    const container = document.getElementById(containerId);
    if (!container) return null;

    // State
    let _data       = [...data];
    let _filtered   = [...data];
    let _sortKey    = null;
    let _sortDir    = 'asc';
    let _page       = 1;
    let _pageSize   = pageSize;
    let _searchTerm = '';

    // ── Build DOM ──────────────────────────────────────────────
    container.innerHTML = `
      <div class="table-container">
        <div class="table-toolbar">
          <div class="table-toolbar__filters">
            <div class="table-search">
              <span class="table-search__icon" aria-hidden="true">🔍</span>
              <input
                type="search"
                class="table-search__input"
                id="${containerId}-search"
                placeholder="Search…"
                aria-label="Search table"
              >
            </div>
            <div id="${containerId}-extra-filters"></div>
          </div>
          <div class="table-toolbar__actions" id="${containerId}-actions"></div>
        </div>
        <div style="overflow-x:auto;">
          <table class="data-table" role="grid" aria-label="Data table">
            <thead id="${containerId}-thead"></thead>
            <tbody id="${containerId}-tbody"></tbody>
          </table>
        </div>
        <div class="table-pagination" id="${containerId}-pagination"></div>
      </div>
    `;

    const thead      = document.getElementById(`${containerId}-thead`);
    const tbody      = document.getElementById(`${containerId}-tbody`);
    const pagination = document.getElementById(`${containerId}-pagination`);
    const searchInput= document.getElementById(`${containerId}-search`);

    // ── Render Header ──────────────────────────────────────────
    function _renderHeader() {
      const ths = columns.map(col => `
        <th data-key="${col.key ?? ''}" class="${_sortKey === col.key ? 'sorted' : ''}"
            tabindex="0" scope="col">
          ${_escHtml(col.label ?? '')}
          ${col.sortable !== false ? `<span class="sort-icon" aria-hidden="true">${_sortKey === col.key ? (_sortDir === 'asc' ? '▲' : '▼') : '⇅'}</span>` : ''}
        </th>
      `).join('');
      thead.innerHTML = `<tr>${ths}</tr>`;

      // Sort listeners
      thead.querySelectorAll('th[data-key]').forEach(th => {
        th.addEventListener('click', () => _handleSort(th.dataset.key));
        th.addEventListener('keydown', e => { if (e.key === 'Enter') _handleSort(th.dataset.key); });
      });
    }

    // ── Render Rows ────────────────────────────────────────────
    function _renderRows() {
      const start = (_page - 1) * _pageSize;
      const page  = _filtered.slice(start, start + _pageSize);

      if (page.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="${columns.length}" style="padding:var(--space-12) var(--space-6); text-align:center; color:var(--color-text-muted);">
              <div class="empty-state__icon">📋</div>
              <div>${_escHtml(emptyMessage)}</div>
            </td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = page.map(row => {
        const cells = columns.map(col => {
          const raw   = row[col.key] ?? '';
          const value = col.render ? col.render(raw, row) : _escHtml(String(raw));
          return `<td>${value}</td>`;
        }).join('');
        return `<tr role="row">${cells}</tr>`;
      }).join('');

      // Attach row action listeners
      if (onRowAction) {
        tbody.querySelectorAll('[data-action]').forEach(el => {
          el.addEventListener('click', e => {
            e.stopPropagation();
            const btn = e.currentTarget;
            const rowIndex = parseInt(btn.closest('tr').rowIndex) - 1 + start;
            onRowAction(btn.dataset.action, _filtered[rowIndex]);
          });
        });
      }
    }

    // ── Render Pagination ──────────────────────────────────────
    function _renderPagination() {
      const total = _filtered.length;
      const pages = Math.ceil(total / _pageSize);
      const start = (_page - 1) * _pageSize + 1;
      const end   = Math.min(_page * _pageSize, total);

      let btns = '';
      btns += `<button class="pagination-btn" id="${containerId}-prev" aria-label="Previous page" ${_page <= 1 ? 'disabled' : ''}>‹</button>`;
      for (let i = 1; i <= pages; i++) {
        if (i === 1 || i === pages || Math.abs(i - _page) <= 1) {
          btns += `<button class="pagination-btn ${i === _page ? 'pagination-btn--active' : ''}" data-page="${i}" aria-label="Page ${i}" aria-current="${i === _page ? 'page' : 'false'}">${i}</button>`;
        } else if (Math.abs(i - _page) === 2) {
          btns += `<span style="padding:0 4px;color:var(--color-text-muted)">…</span>`;
        }
      }
      btns += `<button class="pagination-btn" id="${containerId}-next" aria-label="Next page" ${_page >= pages ? 'disabled' : ''}>›</button>`;

      pagination.innerHTML = `
        <div class="table-pagination__info">
          Showing <strong>${total === 0 ? 0 : start}–${end}</strong> of <strong>${total}</strong> records
        </div>
        <div class="table-pagination__controls">${btns}</div>
      `;

      pagination.querySelectorAll('[data-page]').forEach(btn => {
        btn.addEventListener('click', () => { _page = parseInt(btn.dataset.page); _render(); });
      });
      const prevBtn = document.getElementById(`${containerId}-prev`);
      const nextBtn = document.getElementById(`${containerId}-next`);
      if (prevBtn) prevBtn.addEventListener('click', () => { _page--; _render(); });
      if (nextBtn) nextBtn.addEventListener('click', () => { _page++; _render(); });
    }

    // ── Sorting ────────────────────────────────────────────────
    function _handleSort(key) {
      if (!key) return;
      if (_sortKey === key) {
        _sortDir = _sortDir === 'asc' ? 'desc' : 'asc';
      } else {
        _sortKey = key;
        _sortDir = 'asc';
      }
      _applyFiltersAndSort();
      _render();
    }

    // ── Filtering & Sorting ────────────────────────────────────
    function _applyFiltersAndSort() {
      let result = [..._data];
      const term = _searchTerm.toLowerCase().trim();

      if (term) {
        const fields = searchFields.length > 0 ? searchFields : columns.map(c => c.key);
        result = result.filter(row =>
          fields.some(f => String(row[f] ?? '').toLowerCase().includes(term))
        );
      }

      if (_sortKey) {
        result.sort((a, b) => {
          const av = String(a[_sortKey] ?? '').toLowerCase();
          const bv = String(b[_sortKey] ?? '').toLowerCase();
          return _sortDir === 'asc' ? av.localeCompare(bv) : bv.localeCompare(av);
        });
      }

      _filtered = result;
      _page     = 1;
    }

    // ── Full Render ────────────────────────────────────────────
    function _render() {
      _renderHeader();
      _renderRows();
      _renderPagination();
    }

    // ── Search Listener ────────────────────────────────────────
    let _searchDebounce;
    searchInput.addEventListener('input', () => {
      clearTimeout(_searchDebounce);
      _searchDebounce = setTimeout(() => {
        _searchTerm = searchInput.value;
        _applyFiltersAndSort();
        _render();
      }, 200);
    });

    // ── Public Methods ─────────────────────────────────────────
    function setData(rows) {
      _data = [...rows];
      _applyFiltersAndSort();
      _render();
    }

    // Initial render
    _render();

    return {
      setData,
      refresh: () => _render(),
      getExtraFiltersContainer: () => document.getElementById(`${containerId}-extra-filters`),
      getActionsContainer: () => document.getElementById(`${containerId}-actions`),
      applyFilter: (fn) => {
        _filtered = _data.filter(fn);
        _page = 1;
        _render();
      },
    };
  }

  // ── Helpers ────────────────────────────────────────────────
  function _escHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  return { create };
})();


/* --- js/components/Drawer.js --- */
/**
 * @file Drawer.js
 * @description Employee profile drawer component controller.
 *              Manages open/close state, tab switching, and profile rendering.
 */

'use strict';

const Drawer = (() => {

  const drawerEl    = document.getElementById('employeeDrawer');
  const overlayEl   = document.getElementById('drawerOverlay');
  const closeBtn    = document.getElementById('drawerClose');
  const drawerBody  = document.getElementById('drawerBody');
  const drawerName  = document.getElementById('drawerName');
  const drawerSub   = document.getElementById('drawerSubtitle');
  const drawerAvatar= document.getElementById('drawerAvatar');

  let _currentEmployee = null;

  // ── Lifecycle ──────────────────────────────────────────────

  function open(employee) {
    _currentEmployee = employee;
    _renderProfile(employee);
    drawerEl.classList.add('drawer--open');
    overlayEl.classList.add('drawer-overlay--visible');
    drawerEl.setAttribute('aria-hidden', 'false');
    overlayEl.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';

    // Focus management
    setTimeout(() => closeBtn.focus(), 300);
  }

  function close() {
    drawerEl.classList.remove('drawer--open');
    overlayEl.classList.remove('drawer-overlay--visible');
    drawerEl.setAttribute('aria-hidden', 'true');
    overlayEl.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
    _currentEmployee = null;
  }

  // ── Tab Management ─────────────────────────────────────────

  function _initTabs() {
    const tabs = drawerEl.querySelectorAll('.drawer__tab');
    tabs.forEach(tab => {
      tab.addEventListener('click', () => _switchTab(tab.dataset.tab));
      tab.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') _switchTab(tab.dataset.tab);
      });
    });
  }

  function _switchTab(tabKey) {
    drawerEl.querySelectorAll('.drawer__tab').forEach(t => {
      const isActive = t.dataset.tab === tabKey;
      t.classList.toggle('drawer__tab--active', isActive);
      t.setAttribute('aria-selected', String(isActive));
      t.tabIndex = isActive ? 0 : -1;
    });
    drawerBody.querySelectorAll('.drawer__tab-panel').forEach(p => {
      p.classList.toggle('drawer__tab-panel--active', p.dataset.panel === tabKey);
    });
  }

  // ── Profile Rendering ──────────────────────────────────────

  function _renderProfile(emp) {
    // Header
    const initials = (emp.name || '?').split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();
    drawerAvatar.textContent = initials;
    drawerName.textContent   = emp.name || '—';
    drawerSub.textContent    = [emp.title, emp.department].filter(Boolean).join(' · ');

    drawerBody.innerHTML = `
      <!-- Personal Tab -->
      <div class="drawer__tab-panel drawer__tab-panel--active" data-panel="personal">
        <div class="profile-section">
          <div class="profile-section__title">Personal Information</div>
          <div class="profile-fields">
            ${_field('Employee Code', emp.code)}
            ${_field('English Name', emp.name)}
            ${_field('Arabic Name', emp.nameAr || '—')}
            ${_field('Gender', emp.gender || '—')}
            ${_field('Date of Birth', _formatDate(emp.birthDate))}
            ${_field('Age', emp.age ? `${emp.age} years` : '—')}
            ${_field('Nationality', emp.nationality || '—')}
            ${_field('Classification', emp.class || '—')}
            ${_field('Employment Type', emp.direct || '—')}
            ${_field('Local / Expat', emp.localExpat || '—')}
          </div>
        </div>
      </div>

      <!-- Job Details Tab -->
      <div class="drawer__tab-panel" data-panel="job">
        <div class="profile-section">
          <div class="profile-section__title">Job Information</div>
          <div class="profile-fields">
            ${_field('Job Title', emp.title || '—')}
            ${_field('Department', emp.department || '—')}
            ${_field('Section', emp.section || '—')}
            ${_field('Project / Site', emp.project || '—')}
            ${_field('Acting As', emp.actingAs || '—')}
            ${_field('Hire Date', _formatDate(emp.hireDate))}
            ${_field('Tenure', emp.tenureYears ? `${emp.tenureYears} years` : '—')}
            ${_field('Remarks', emp.remarks || '—')}
          </div>
        </div>
      </div>

      <!-- Documents Tab -->
      <div class="drawer__tab-panel" data-panel="documents">
        <div class="profile-section">
          <div class="profile-section__title">Identity Documents</div>
          <div class="profile-fields">
            ${_field('Passport No.', emp.passportNo || '—')}
            ${_fieldWithBadge('Passport Expiry', _formatDate(emp.passportExp), emp.passportStatus)}
            ${_field('Civil / Resident ID', emp.civilNo || '—')}
            ${_fieldWithBadge('Civil ID Expiry', _formatDate(emp.civilExp), emp.civilStatus)}
          </div>
        </div>
        <div class="profile-section">
          <div class="profile-section__title">Contract</div>
          <div class="profile-fields">
            ${_fieldWithBadge('Contract Expiry', _formatDate(emp.contractExp), emp.contractStatus)}
          </div>
        </div>
        <div class="profile-section">
          <div class="profile-section__title">Banking Details</div>
          <div class="profile-fields">
            ${_field('Bank', emp.bank || '—')}
            ${_field('Account No.', emp.bankAcc || '—')}
            ${_field('SWIFT Code', emp.swift || '—')}
          </div>
        </div>
      </div>

      <!-- Contact Tab -->
      <div class="drawer__tab-panel" data-panel="contact">
        <div class="profile-section">
          <div class="profile-section__title">Contact Information</div>
          <div class="profile-fields">
            ${_field('Email', emp.email || '—')}
            ${_field('Telephone', emp.telephone || '—')}
          </div>
        </div>
        <div class="profile-section">
          <div class="profile-section__title">Emergency Contacts</div>
          <div class="profile-fields">
            ${_field('Contact 1 Phone', emp.emergency1 || '—')}
            ${_field('Contact 1 Relation', emp.relation1 || '—')}
            ${_field('Contact 2 Phone', emp.emergency2 || '—')}
            ${_field('Contact 2 Relation', emp.relation2 || '—')}
          </div>
        </div>
      </div>
    `;

    _initTabs();
    _switchTab('personal');
  }

  // ── Field Helpers ──────────────────────────────────────────

  function _field(label, value) {
    const isEmpty = !value || value === '—';
    return `
      <div class="form-group">
        <div class="profile-field__label">${_esc(label)}</div>
        <div class="profile-field__value ${isEmpty ? 'profile-field__value--empty' : ''}">${_esc(value)}</div>
      </div>
    `;
  }

  function _fieldWithBadge(label, value, status) {
    const badgeClass = _statusToBadgeClass(status);
    return `
      <div class="form-group">
        <div class="profile-field__label">${_esc(label)}</div>
        <div class="profile-field__value" style="display:flex;align-items:center;gap:8px;">
          ${_esc(value || '—')}
          ${status ? `<span class="badge badge--${badgeClass}">${_esc(status)}</span>` : ''}
        </div>
      </div>
    `;
  }

  function _statusToBadgeClass(status) {
    const map = { Valid: 'valid', 'Due Soon': 'due-soon', Critical: 'critical', Expired: 'expired', Missing: 'missing' };
    return map[status] ?? 'neutral';
  }

  function _formatDate(iso) {
    if (!iso) return '—';
    try {
      const d = new Date(iso);
      return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
    } catch { return iso; }
  }

  function _esc(str) {
    return String(str ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  // ── Event Listeners ────────────────────────────────────────

  closeBtn?.addEventListener('click', close);
  overlayEl?.addEventListener('click', close);

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && drawerEl?.classList.contains('drawer--open')) close();
  });

  return { open, close };
})();


/* --- js/components/Charts.js --- */
/**
 * @file Charts.js
 * @description Chart factory using Chart.js.
 *              Provides standardized chart creation with consistent theming.
 *              All charts use the design system color palette.
 */

'use strict';

const Charts = (() => {

  // ── Design System Palette ──────────────────────────────────
  const PALETTE = [
    '#0078d4', '#0091ff', '#00b4d8', '#00c49a',
    '#107c10', '#d97706', '#e74c3c', '#8b5cf6',
    '#ec4899', '#64748b', '#0e7490', '#65a30d',
  ];

  const EXPIRY_PALETTE = {
    'Valid':    '#107c10',
    'Due Soon': '#d97706',
    'Critical': '#e74c3c',
    'Expired':  '#8b0000',
    'Missing':  '#9b9bb4',
  };

  // Global Chart.js defaults
  if (typeof Chart !== 'undefined') {
    Chart.defaults.font.family = "'Inter', -apple-system, sans-serif";
    Chart.defaults.font.size   = 12;
    Chart.defaults.color       = '#5c5c7a';
    Chart.defaults.plugins.legend.position = 'bottom';
    Chart.defaults.plugins.legend.labels.boxWidth = 12;
    Chart.defaults.plugins.legend.labels.padding  = 16;
    Chart.defaults.animation.duration = 600;
  }

  // ── Registry — tracks chart instances to allow re-render ──
  const _instances = {};

  function _destroy(canvasId) {
    if (_instances[canvasId]) {
      _instances[canvasId].destroy();
      delete _instances[canvasId];
    }
  }

  // ────────────────────────────────────────────────────────────
  //  CHART FACTORIES
  // ────────────────────────────────────────────────────────────

  /**
   * Renders a donut chart.
   * @param {string} canvasId
   * @param {Object[]} data - [{ label, count }]
   * @param {string} [title]
   * @param {Function} [onClickHandler] - callback(label)
   */
  function donut(canvasId, data, title = '', onClickHandler = null) {
    _destroy(canvasId);
    const canvas = document.getElementById(canvasId);
    if (!canvas) return;

    _instances[canvasId] = new Chart(canvas, {
      type: 'doughnut',
      data: {
        labels: data.map(d => d.label),
        datasets: [{
          data: data.map(d => d.count),
          backgroundColor: PALETTE.slice(0, data.length),
          borderWidth: 2,
          borderColor: '#ffffff',
          hoverOffset: 6,
        }],
      },
      options: {
        responsive: true,
        maintainAspectRatio: true,
        cutout: '65%',
        plugins: {
          tooltip: { callbacks: {
            label: ctx => ` ${ctx.label}: ${ctx.parsed} (${Math.round(ctx.parsed / ctx.chart.data.datasets[0].data.reduce((a, b) => a + b, 0) * 100)}%)`
          }},
        },
        onClick: (e, elements, chart) => {
          if (onClickHandler && elements.length > 0) {
            const index = elements[0].index;
            const label = chart.data.labels[index];
            if (label) onClickHandler(label);
          }
        },
      },
    });
  }

  /**
   * Renders a horizontal bar chart.
   * @param {string} canvasId
   * @param {Object[]} data - [{ label, count }]
   * @param {Function} [onClickHandler] - callback(label)
   */
  function horizontalBar(canvasId, data, onClickHandler = null) {
    _destroy(canvasId);
    const canvas = document.getElementById(canvasId);
    if (!canvas) return;

    _instances[canvasId] = new Chart(canvas, {
      type: 'bar',
      data: {
        labels: data.map(d => d.label),
        datasets: [{
          data: data.map(d => d.count),
          backgroundColor: PALETTE[0],
          borderRadius: 4,
          hoverBackgroundColor: PALETTE[1],
        }],
      },
      options: {
        indexAxis: 'y',
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { grid: { color: '#f0f2f5' }, ticks: { precision: 0 } },
          y: { grid: { display: false } },
        },
        onClick: (e, elements, chart) => {
          if (onClickHandler && elements.length > 0) {
            const index = elements[0].index;
            const label = chart.data.labels[index];
            if (label) onClickHandler(label);
          }
        },
      },
    });
  }

  /**
   * Renders a vertical bar / column chart.
   * @param {string} canvasId
   * @param {Object[]} data - [{ label, count }]
   * @param {Function} [onClickHandler] - callback(label)
   */
  function verticalBar(canvasId, data, onClickHandler = null) {
    _destroy(canvasId);
    const canvas = document.getElementById(canvasId);
    if (!canvas) return;

    _instances[canvasId] = new Chart(canvas, {
      type: 'bar',
      data: {
        labels: data.map(d => d.label),
        datasets: [{
          data: data.map(d => d.count),
          backgroundColor: PALETTE.slice(0, data.length),
          borderRadius: 4,
        }],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          y: { grid: { color: '#f0f2f5' }, ticks: { precision: 0 } },
          x: { grid: { display: false } },
        },
        onClick: (e, elements, chart) => {
          if (onClickHandler && elements.length > 0) {
            const index = elements[0].index;
            const label = chart.data.labels[index];
            if (label) onClickHandler(label);
          }
        },
      },
    });
  }

  /**
   * Renders a line / area chart for trend data.
   * @param {string} canvasId
   * @param {Object[]} data - [{ period, count }]
   * @param {string} [label]
   * @param {Function} [onClickHandler] - callback(period)
   */
  function line(canvasId, data, label = 'Hires', onClickHandler = null) {
    _destroy(canvasId);
    const canvas = document.getElementById(canvasId);
    if (!canvas) return;

    _instances[canvasId] = new Chart(canvas, {
      type: 'line',
      data: {
        labels: data.map(d => d.period),
        datasets: [{
          label,
          data: data.map(d => d.count),
          borderColor: PALETTE[0],
          backgroundColor: 'rgba(0,120,212,0.08)',
          borderWidth: 2,
          pointRadius: 4,
          pointBackgroundColor: PALETTE[0],
          fill: true,
          tension: 0.35,
        }],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          y: { grid: { color: '#f0f2f5' }, ticks: { precision: 0 } },
          x: { grid: { display: false } },
        },
        onClick: (e, elements, chart) => {
          if (onClickHandler && elements.length > 0) {
            const index = elements[0].index;
            const label = chart.data.labels[index];
            if (label) onClickHandler(label);
          }
        },
      },
    });
  }

  /**
   * Renders a stacked bar chart for expiry status summaries.
   * @param {string} canvasId
   * @param {Object[]} data - [{ status, count }]
   */
  function expiryStatus(canvasId, data) {
    _destroy(canvasId);
    const canvas = document.getElementById(canvasId);
    if (!canvas) return;

    _instances[canvasId] = new Chart(canvas, {
      type: 'bar',
      data: {
        labels: data.map(d => d.status),
        datasets: [{
          data: data.map(d => d.count),
          backgroundColor: data.map(d => EXPIRY_PALETTE[d.status] ?? PALETTE[10]),
          borderRadius: 4,
        }],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          y: { grid: { color: '#f0f2f5' }, ticks: { precision: 0 } },
          x: { grid: { display: false } },
        },
      },
    });
  }

  return { donut, horizontalBar, verticalBar, line, expiryStatus };
})();


/* --- js/api.js --- */
/**
 * @file api.js
 * @description Client-side API bridge for google.script.run calls.
 *              Provides: promise wrappers, caching layer, loading state management.
 *              All frontend modules must call GAS through this module only.
 */

'use strict';

const API = (() => {

  // ────────────────────────────────────────────────────────────
  //  CACHE STORE
  // ────────────────────────────────────────────────────────────
  const _cache = {};
  const CACHE_TTL_MS = 5 * 60 * 1000; // 5 minutes

  function _cacheGet(key) {
    const entry = _cache[key];
    if (!entry) return null;
    if (Date.now() - entry.timestamp > CACHE_TTL_MS) {
      delete _cache[key];
      return null;
    }
    return entry.data;
  }

  function _cacheSet(key, data) {
    _cache[key] = { data, timestamp: Date.now() };
  }

  function invalidateCache(key) {
    if (key) delete _cache[key];
    else Object.keys(_cache).forEach(k => delete _cache[k]);
  }

  // ────────────────────────────────────────────────────────────
  //  GAS CALL WRAPPER
  // ────────────────────────────────────────────────────────────

  /**
   * Wraps a google.script.run call in a Promise.
   * Handles success/failure handlers and response envelope validation.
   * @param {string} fnName - GAS function name
   * @param {...*} args - Arguments to pass
   * @returns {Promise<*>} Resolves with response.data or rejects with Error
   */
  function _call(fnName, ...args) {
    return new Promise((resolve, reject) => {
      let runner = google.script.run
        .withSuccessHandler(response => {
          if (!response || response.status !== 'success') {
            reject(new Error(response?.message || `${fnName} returned an error.`));
            return;
          }
          resolve(response.data);
        })
        .withFailureHandler(err => {
          console.error(`[API] ${fnName} failed:`, err);
          reject(new Error(err.message || `${fnName} call failed.`));
        });

      runner[fnName](...args);
    });
  }

  // ────────────────────────────────────────────────────────────
  //  PUBLIC API METHODS
  // ────────────────────────────────────────────────────────────

  async function getAllEmployees(forceRefresh = false) {
    const CACHE_KEY = 'employees';
    if (!forceRefresh) {
      const cached = _cacheGet(CACHE_KEY);
      if (cached) return cached;
    }
    const data = await _call('api_getAllEmployees');
    _cacheSet(CACHE_KEY, data);
    return data;
  }

  async function getEmployeeByCode(code) {
    return _call('api_getEmployeeByCode', code);
  }

  async function getLookupData(forceRefresh = false) {
    const CACHE_KEY = 'lookups';
    if (!forceRefresh) {
      const cached = _cacheGet(CACHE_KEY);
      if (cached) return cached;
    }
    const data = await _call('api_getLookupData');
    _cacheSet(CACHE_KEY, data);
    return data;
  }

  async function getDocumentCenterData(forceRefresh = false) {
    const CACHE_KEY = 'documents';
    if (!forceRefresh) {
      const cached = _cacheGet(CACHE_KEY);
      if (cached) return cached;
    }
    const data = await _call('api_getDocumentCenterData');
    _cacheSet(CACHE_KEY, data);
    return data;
  }

  async function getInsightsData(forceRefresh = false) {
    const CACHE_KEY = 'insights';
    if (!forceRefresh) {
      const cached = _cacheGet(CACHE_KEY);
      if (cached) return cached;
    }
    const data = await _call('api_getInsightsData');
    _cacheSet(CACHE_KEY, data);
    return data;
  }

  async function getAllSettings(forceRefresh = false) {
    const CACHE_KEY = 'settings';
    if (!forceRefresh) {
      const cached = _cacheGet(CACHE_KEY);
      if (cached) return cached;
    }
    const data = await _call('api_getAllSettings');
    _cacheSet(CACHE_KEY, data);
    return data;
  }

  async function updateSetting(key, value) {
    const result = await _call('api_updateSetting', key, value);
    invalidateCache('settings');
    return result;
  }

  async function bulkUpdateSettings(settingsMap) {
    const result = await _call('api_bulkUpdateSettings', settingsMap);
    invalidateCache('settings');
    return result;
  }

  // ────────────────────────────────────────────────────────────
  //  PUBLIC API
  // ────────────────────────────────────────────────────────────

  return {
    getAllEmployees,
    getEmployeeByCode,
    getLookupData,
    getDocumentCenterData,
    getInsightsData,
    getAllSettings,
    updateSetting,
    bulkUpdateSettings,
    invalidateCache,
  };
})();

/**

 * @description Dashboard module — renders KPI cards and document expiry sections.
 *              Data is provided from the shared app state (AppState.employees + AppState.documents).

'use strict';

const DashboardModule = (() => {

  function render(employees, docData) {

    const { summary, documents } = docData;

    // ── KPI Cards ────────────────────────────────────────────
    const totalEmp  = employees.length;
    const activeProjects = new Set(employees.map(e => e.project).filter(Boolean)).size;
    const expiredDocs    = summary.expired;
    const criticalDocs   = documents.filter(d => d.status === 'Critical').length;

    const kpiHtml = `
      <div class="kpi-grid" role="list">
        ${_kpiCard('Total Employees', totalEmp, '👥', 'primary', 'All active employees')}
        ${_kpiCard('Active Projects', activeProjects, '🏗️', 'info', 'Distinct project sites')}
        ${_kpiCard('Expired Documents', expiredDocs, '🔴', 'danger', 'Documents already expired')}
        ${_kpiCard('Critical (≤30 days)', criticalDocs, '⚠️', 'warning', 'Expiring within 30 days')}
        ${_kpiCard('Expiring This Month', summary.thisMonth, '📅', 'warning', 'Expiring within 30 days')}
        ${_kpiCard('Expiring This Week', summary.thisWeek, '⏳', 'danger', 'Expiring within 7 days')}
      </div>
    `;

    // ── Document Expiry Summary Cards ────────────────────────
    const expiryHtml = `
      <div class="card mb-6">
        <div class="card__header">
          <div class="card__title"><span class="card__title-icon">📁</span> Document Expiry Alerts</div>
        </div>
        <div class="expiry-summary-grid">
          ${_expiryCard('🔴', 'Expired', summary.expired, 'expiry-card--expired')}
          ${_expiryCard('🔥', 'Today', summary.today, 'expiry-card--today')}
          ${_expiryCard('☀️', 'Tomorrow', summary.tomorrow, 'expiry-card--tomorrow')}
          ${_expiryCard('📆', 'This Week', summary.thisWeek, 'expiry-card--week')}
          ${_expiryCard('🗓️', 'Next Week', summary.nextWeek, 'expiry-card--week')}
          ${_expiryCard('🗒️', 'This Month', summary.thisMonth, 'expiry-card--month')}
          ${_expiryCard('📅', 'This Year', summary.thisYear, 'expiry-card--year')}
        </div>
      </div>
    `;

    // ── Recent Critical Documents Table ──────────────────────
    const critical = documents
      .filter(d => ['Critical', 'Expired'].includes(d.status))
      .slice(0, 10);

    const criticalRows = critical.map(doc => `
      <tr>
        <td><span class="font-bold">${_esc(doc.employeeCode)}</span></td>
        <td>${_esc(doc.employeeName)}</td>
        <td>${_esc(doc.docType)}</td>
        <td>${_esc(doc.department)}</td>
        <td>${_esc(doc.project)}</td>
        <td>${_esc(doc.expiryDate ? new Date(doc.expiryDate).toLocaleDateString('en-GB', {day:'2-digit',month:'short',year:'numeric'}) : '—')}</td>
        <td><span class="badge badge--${_statusClass(doc.status)}">${_esc(doc.status)}</span></td>
      </tr>
    `).join('');

    const criticalTableHtml = `
      <div class="card">
        <div class="card__header">
          <div class="card__title"><span class="card__title-icon">🚨</span> Critical & Expired Documents</div>
          <button class="btn btn--ghost btn--sm" onclick="AppRouter.navigate('documents')">View All →</button>
        </div>
        ${critical.length === 0
          ? `<div class="empty-state"><div class="empty-state__icon">✅</div><div class="empty-state__title">All clear!</div><div class="empty-state__message">No critical or expired documents.</div></div>`
          : `<div style="overflow-x:auto;"><table class="data-table">
              <thead><tr>
                <th>Code</th><th>Name</th><th>Document</th><th>Department</th><th>Project</th><th>Expiry Date</th><th>Status</th>
              </tr></thead>
              <tbody>${criticalRows}</tbody>
            </table></div>`
        }
      </div>
    `;

    container.innerHTML = kpiHtml + expiryHtml + criticalTableHtml;
  }

  // ── Private Helpers ────────────────────────────────────────

  function _kpiCard(label, value, icon, variant, footer) {
    return `
      <div class="kpi-card kpi-card--${variant}" role="listitem" tabindex="0">
        <div class="kpi-card__header">
          <span class="kpi-card__label">${_esc(label)}</span>
          <div class="kpi-card__icon" aria-hidden="true">${icon}</div>
        </div>
        <div class="kpi-card__value">${value}</div>
        <div class="kpi-card__footer">${_esc(footer)}</div>
      </div>
    `;
  }

  function _expiryCard(icon, label, count, cssClass) {
    return `
      <div class="expiry-card ${cssClass}" tabindex="0" role="button" aria-label="${_esc(label)}: ${count} documents">
        <div class="expiry-card__icon" aria-hidden="true">${icon}</div>
        <div class="expiry-card__count">${count}</div>
        <div class="expiry-card__label">${_esc(label)}</div>
      </div>
    `;
  }

  function _statusClass(status) {
    const map = { 'Valid':'valid', 'Due Soon':'due-soon', 'Critical':'critical', 'Expired':'expired', 'Missing':'missing' };
    return map[status] ?? 'neutral';
  }

  function _esc(str) {
    return String(str ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  return { render };
})();

    const cls   = document.getElementById('filterClass')?.value;

    _table?.applyFilter(emp => {

          && (!proj || emp.project === proj)
          && (!cls  || emp.class === cls);
    });
  }

  // ── Helpers ────────────────────────────────────────────────

  function _select(id, placeholder, options) {
    const opts = options.map(o => `<option value="${_esc(o)}">${_esc(o)}</option>`).join('');
    return `
      <select class="filter-select" id="${id}" aria-label="${_esc(placeholder)}">
        <option value="">${_esc(placeholder)}</option>
        ${opts}
      </select>
    `;
  }

  function _initials(name) {
    return (name || '?').split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();
  }

  function _statusClass(status) {
    const m = { 'Valid':'valid','Due Soon':'due-soon','Critical':'critical','Expired':'expired','Missing':'missing' };
    return m[status] ?? 'neutral';
  }

  function _esc(str) {
    return String(str ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  return { render };
})();

/**
 * @file documentCenter.js
 * @description Document Center module — renders expiry summary cards
 *              and a filterable, sortable document expiry table.
 */

'use strict';

const DocumentCenterModule = (() => {

  let _table = null;
  let _allDocs = [];

  function render(docData) {
    const container = document.getElementById('documentsContent');
    if (!container) return;

    const { summary, documents } = docData;
    _allDocs = documents;

    // ── Summary Cards ─────────────────────────────────────────
    const summaryHtml = `
      <div class="expiry-summary-grid mb-6">
        ${_card('🔴', 'Expired',    summary.expired,   'expiry-card--expired',  'expired')}
        ${_card('🔥', 'Today',      summary.today,     'expiry-card--today',    'today')}
        ${_card('☀️', 'Tomorrow',   summary.tomorrow,  'expiry-card--tomorrow', 'tomorrow')}
        ${_card('📆', 'This Week',  summary.thisWeek,  'expiry-card--week',     'week')}
        ${_card('🗓️', 'Next Week',  summary.nextWeek,  'expiry-card--week',     'nextweek')}
        ${_card('🗒️', 'This Month', summary.thisMonth, 'expiry-card--month',    'month')}
        ${_card('📅', 'This Year',  summary.thisYear,  'expiry-card--year',     'year')}
      </div>
    `;

    container.innerHTML = summaryHtml + `<div id="docTableContainer"></div>`;

    // ── Expiry Card Click Filters ─────────────────────────────
    container.querySelectorAll('.expiry-card[data-filter]').forEach(card => {
      card.addEventListener('click', () => _filterByTimeframe(card.dataset.filter));
    });

    // ── Documents Table ───────────────────────────────────────
    _table = DataTable.create({
      containerId: 'docTableContainer',
      searchFields: ['employeeCode', 'employeeName', 'department', 'project', 'docType'],
      columns: [
        { key: 'employeeCode', label: 'Code' },
        { key: 'employeeName', label: 'Employee Name' },
        { key: 'docType',      label: 'Document Type' },
        { key: 'department',   label: 'Department' },
        { key: 'project',      label: 'Project' },
        {
          key: 'expiryDate',
          label: 'Expiry Date',
          render: val => val ? new Date(val).toLocaleDateString('en-GB', {day:'2-digit',month:'short',year:'numeric'}) : '—',
        },
        {
          key: 'daysLeft',
          label: 'Days Left',
          render: val => {
            if (val === null || val === undefined) return '—';
            const n = Number(val);
            const color = n < 0 ? 'var(--color-expired)' : n <= 30 ? 'var(--color-critical)' : n <= 90 ? 'var(--color-warning)' : 'var(--color-valid)';
            return `<span style="font-weight:700;color:${color}">${n < 0 ? 'Expired ' + Math.abs(n) + 'd ago' : n + ' days'}</span>`;
          },
        },
        {
          key: 'status',
          label: 'Status',
          render: val => `<span class="badge badge--${_statusClass(val)}">${_esc(val || '—')}</span>`,
        },
      ],
      data: documents,
      pageSize: 25,
      emptyMessage: 'No documents found for the selected filter.',
    });

    // ── Type Filter ────────────────────────────────────────────
    const extraFilters = _table.getExtraFiltersContainer();
    if (extraFilters) {
      extraFilters.innerHTML = `
        <select class="filter-select" id="docTypeFilter" aria-label="Filter by document type">
          <option value="">All Document Types</option>
          <option value="Passport">Passport</option>
          <option value="Civil / Resident ID">Civil / Resident ID</option>
          <option value="Contract">Contract</option>
        </select>
        <select class="filter-select" id="docStatusFilter" aria-label="Filter by status">
          <option value="">All Statuses</option>
          <option value="Expired">Expired</option>
          <option value="Critical">Critical</option>
          <option value="Due Soon">Due Soon</option>
          <option value="Valid">Valid</option>
          <option value="Missing">Missing</option>
        </select>
      `;
      document.getElementById('docTypeFilter')?.addEventListener('change', _applyFilters);
      document.getElementById('docStatusFilter')?.addEventListener('change', _applyFilters);
    }
  }

  // ── Filter Handlers ────────────────────────────────────────

  function _applyFilters() {
    const type   = document.getElementById('docTypeFilter')?.value;
    const status = document.getElementById('docStatusFilter')?.value;
    _table?.applyFilter(doc =>
      (!type   || doc.docType === type)
      && (!status || doc.status === status)
    );
  }

  function _filterByTimeframe(filter) {
    const today = new Date();
    today.setHours(0,0,0,0);
    const tomorrow = new Date(today);
    tomorrow.setDate(tomorrow.getDate() + 1);

    _table?.applyFilter(doc => {
      const days = doc.daysLeft;
      if (filter === 'expired')  return days !== null && days < 0;
      if (filter === 'today')    return days === 0;
      if (filter === 'tomorrow') return days === 1;
      if (filter === 'week')     return days !== null && days >= 0 && days <= 7;
      if (filter === 'nextweek') return days !== null && days >= 8 && days <= 14;
      if (filter === 'month')    return days !== null && days >= 0 && days <= 30;
      if (filter === 'year')     return days !== null && days >= 0 && days <= 365;
      return true;
    });
  }

  // ── Helpers ────────────────────────────────────────────────

  function _card(icon, label, count, cssClass, filterKey) {
    return `
      <div class="expiry-card ${cssClass}" data-filter="${filterKey}" tabindex="0" role="button"
           aria-label="Filter: ${_esc(label)}, ${count} documents">
        <div class="expiry-card__icon" aria-hidden="true">${icon}</div>
        <div class="expiry-card__count">${count}</div>
        <div class="expiry-card__label">${_esc(label)}</div>
      </div>
    `;
  }

  function _statusClass(status) {
    const m = { 'Valid':'valid','Due Soon':'due-soon','Critical':'critical','Expired':'expired','Missing':'missing' };
    return m[status] ?? 'neutral';
  }

  function _esc(str) {
    return String(str ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  return { render };
})();

              ${_kpi('👨', 'Male',           data.kpis.maleCount,             'primary')}
              ${_kpi('👩', 'Female',         data.kpis.femaleCount,           'success')}
              ${_kpi('🔧', 'Direct',         data.kpis.directCount,           'warning')}
              ${_kpi('💼', 'Indirect',       data.kpis.indirectCount,         'info')}
            </div>
          </div>

          <div class="insights-bottom__charts">

            <div class="chart-card">
              <div class="chart-card__header">
                <div>

                <div class="chart-canvas-wrapper" style="height:${deptHeight}px;">

              </div>
            </div>

          </div>
        </div>

      </div>
    `;

    // ── Render Charts ──────────────────────────────────────
    const crossFilter = (field) => {
      return (label) => {
        if (typeof FilterModule !== 'undefined' && FilterModule.setFilter) {
          FilterModule.setFilter(field, label);
        }
      };
    };

    // Row 1 — Age + Project
    Charts.verticalBar('chart-age',       data.ageDistribution.map(d => ({ label: d.range, count: d.count })));
    Charts.horizontalBar('chart-project', data.byProject,      crossFilter('fp-project'));
    // Row 2 — Donuts
    Charts.donut('chart-nationality',     data.byNationality,  crossFilter('fp-nationality'));
    Charts.donut('chart-gender',          data.byGender,       crossFilter('fp-gender'));
    Charts.donut('chart-class',           data.byClass,        crossFilter('fp-class'));
    // Row 3 — Expiry (Civil first)
    Charts.expiryStatus('chart-civil-expiry',     data.civilExpiryStats);
    Charts.expiryStatus('chart-passport-expiry',  data.passportExpiryStats);
    Charts.expiryStatus('chart-contract-expiry',  data.contractExpiryStats);
    // Row 4 — Hiring Trend
    Charts.line('chart-hiring',           data.hiringTrend, 'New Hires');
    // Bottom — Bar Charts
    Charts.horizontalBar('chart-title',   data.byTitle,        crossFilter('fp-title'));
    Charts.horizontalBar('chart-dept',    data.byDepartment,   crossFilter('fp-dept'));
  }

  // ── Helpers ────────────────────────────────────────────────

  function _kpi(icon, label, value, variant) {
    return `
      <div class="kpi-card kpi-card--${variant}" role="listitem">
        <div class="kpi-card__header">
          <span class="kpi-card__label">${_esc(label)}</span>
          <div class="kpi-card__icon" aria-hidden="true">${icon}</div>
        </div>
        <div class="kpi-card__value">${value}</div>
      </div>
    `;
  }

  function _chartCard(canvasId, title, subtitle, height) {
    return `
      <div class="chart-card" draggable="true" data-chart-id="${canvasId}" role="region" aria-label="${_esc(title)}">
        <div class="chart-card__header">
          <div>
            <div class="chart-card__title">${_esc(title)}</div>
            <div class="chart-card__subtitle">${_esc(subtitle)}</div>
          </div>
          <div class="chart-card__drag-handle" aria-hidden="true" title="Drag to reorder">⠿</div>
        </div>
        <div class="chart-canvas-wrapper" style="height:${height}px;">
          <canvas id="${canvasId}" aria-label="${_esc(title)}" role="img"></canvas>
        </div>
      </div>
    `;
  }

  function _esc(str) {
    return String(str ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  return { render };
})();

/**

 * @description Settings module — renders system configuration UI
 *              and handles saving settings back to GAS via API.
 */

'use strict';

const SettingsModule = (() => {

  let _settings = {};

  async function render() {
    const container = document.getElementById('settingsContent');
